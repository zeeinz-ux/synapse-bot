<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="{{ url_for('static', filename='LOGO-SYNAPSE-NO-BG.png') }}" alt="𝓢𝓎𝓃𝒶𝓅𝓈ℯ Logo" />
    </div>
    <ul class="footer-links">
      <li><a href="#home">{{ "nav.home" | t }}</a></li>
      <li><a href="#faq">{{ "nav.faq" | t }}</a></li>
      <li><a href="#commands">{{ "nav.commands" | t }}</a></li>
      <li><a href="#about">{{ "nav.about" | t }}</a></li>
      <li><a href="https://discord.gg/kwPr32AhGH" target="_blank" rel="noopener noreferrer">{{ "nav.support" | t }}</a></li>
    </ul>
    <div class="footer-actions">
      {% if user %}
      <a href="/dashboard" class="btn-footer-dashboard"><i data-lucide="unlock" width="14" height="14"></i> {{ "hero.dashboard" | t }}</a>
      {% else %}
      <a href="/login" class="btn-footer-login"><i data-lucide="lock" width="14" height="14"></i> {{ "hero.dashboard" | t }}</a>
      {% endif %}
      <a href="https://discord.com/oauth2/authorize?client_id=1505849571039907900&permissions=8&integration_type=0&scope=bot%20applications.commands"
         target="_blank" rel="noopener noreferrer"
         class="btn-footer-invite">{{ "nav.invite" | t }}</a>
    </div>
  </div>
  <div class="footer-bottom">
    <span>{{ "footer.copyright" | t }}</span>
  </div>
</footer>
